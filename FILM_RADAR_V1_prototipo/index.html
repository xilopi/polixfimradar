<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILM RADAR — V1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span>🎬</span><div><b>FILM RADAR</b><small>V1 · Prototipo</small></div></div>
    <nav>
      <button class="nav active" data-view="dashboard">🏠 <span>Inicio</span></button>
      <button class="nav" data-view="clients">🎯 <span>Clientes</span></button>
      <button class="nav" data-view="productions">🎬 <span>Rodajes</span></button>
      <button class="nav" data-view="music">🎵 <span>Artistas & música</span></button>
      <button class="nav" data-view="jobs">💼 <span>Ofertas</span></button>
      <button class="nav" data-view="crm">📋 <span>CRM</span></button>
      <button class="nav" data-view="profile">👤 <span>Mi perfil</span></button>
    </nav>
    <div class="sidebar-foot">Radar inteligente de oportunidades audiovisuales</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">RADAR COMERCIAL</div>
        <h1 id="page-title">Buenos días 👋</h1>
      </div>
      <div class="top-actions">
        <button class="ghost" onclick="showToast('Búsqueda actualizada')">↻ Actualizar</button>
        <button class="avatar">VF</button>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-clients" class="view"></section>
    <section id="view-productions" class="view"></section>
    <section id="view-music" class="view"></section>
    <section id="view-jobs" class="view"></section>
    <section id="view-crm" class="view"></section>
    <section id="view-profile" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
