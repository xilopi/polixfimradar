<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Radar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg: #0b0d09;
  --panel: #151810;
  --panel-2: #1c2016;
  --line: #2b3122;
  --amber: #e8a33d;
  --amber-dim: #a97a2e;
  --rec: #e2453c;
  --text: #ece7d8;
  --muted: #8a8f78;
  --green-ok: #7fae5a;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: radial-gradient(ellipse at top, #131610 0%, var(--bg) 60%);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
  padding-bottom: 60px;
}
.mono{ font-family:'JetBrains Mono', monospace; }
.display{ font-family:'Space Grotesk', sans-serif; }

/* ---------- HEADER ---------- */
header{
  border-bottom:1px solid var(--line);
  padding: 22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.rec-dot{
  width:10px; height:10px; border-radius:50%;
  background: var(--rec);
  box-shadow: 0 0 10px var(--rec);
  animation: pulse 1.6s infinite ease-in-out;
}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.brand h1{
  font-size: 22px; letter-spacing: 3px; text-transform:uppercase;
  font-weight:700;
}
.brand .tag{
  color: var(--amber); font-size: 11px; letter-spacing:2px; text-transform:uppercase;
  margin-top:2px;
}
.tabs{ display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:10px; border:1px solid var(--line); }
.tab-btn{
  background:transparent; border:none; color:var(--muted); font-family:'JetBrains Mono',monospace;
  font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:9px 16px; border-radius:7px;
  cursor:pointer; transition: all .15s ease;
}
.tab-btn.active{ background: var(--amber); color:#1a1204; font-weight:700; }
.tab-btn:not(.active):hover{ color:var(--text); }

main{ max-width: 1100px; margin: 0 auto; padding: 28px; }

/* ---------- SCAN PANEL ---------- */
.scan-panel{
  background: var(--panel);
  border:1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;
  position:relative;
  overflow:hidden;
}
.field{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:180px; }
.field label{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
.field input, .field select{
  background: var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:11px 12px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
}
.field input:focus, .field select:focus{ outline:1px solid var(--amber); }

.scan-btn{
  background: var(--amber); color:#1a1204; border:none; border-radius:8px;
  padding: 13px 22px; font-weight:700; font-family:'Space Grotesk',sans-serif;
  font-size:14px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  display:flex; align-items:center; gap:10px;
  transition: transform .1s ease;
}
.scan-btn:hover{ transform: translateY(-1px); }
.scan-btn:disabled{ opacity:.6; cursor:wait; }

.radar-icon{ width:18px; height:18px; position:relative; }
.radar-icon svg{ width:100%; height:100%; }
.radar-icon.spinning svg{ animation: spin 1.1s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }

.status-line{
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);
  margin-top:14px; min-height:16px; letter-spacing:.5px;
}
.status-line.active{ color: var(--amber); }

/* ---------- RESULTS ---------- */
.results{ margin-top:28px; display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
.card{
  background: var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber);
  border-radius: 10px; padding:18px; display:flex; flex-direction:column; gap:10px;
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card-top h3{ font-family:'Space Grotesk',sans-serif; font-size:16px; line-height:1.3; }
.score{ font-family:'JetBrains Mono',monospace; text-align:right; white-space:nowrap; }
.score .n{ font-size:22px; font-weight:700; color: var(--amber); }
.score .d{ font-size:11px; color:var(--muted); }
.card p.explain{ font-size:13px; color:#c9c4b3; line-height:1.5; }
.tagrow{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{ font-size:11px; font-family:'JetBrains Mono',monospace; background:var(--panel-2); border:1px solid var(--line); color:var(--muted); padding:4px 9px; border-radius:20px; }
.card-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; gap:8px; flex-wrap:wrap; }
.src{ font-size:11px; color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--muted); }
.add-btn{
  background:transparent; border:1px solid var(--amber); color:var(--amber);
  padding:8px 14px; border-radius:7px; font-family:'JetBrains Mono',monospace; font-size:11px;
  text-transform:uppercase; letter-spacing:1px; cursor:pointer;
}
.add-btn:hover{ background: rgba(232,163,61,.1); }
.add-btn:disabled{ opacity:.4; cursor:default; }

.empty{
  text-align:center; color:var(--muted); padding:50px 20px; font-family:'JetBrains Mono',monospace; font-size:13px;
}

/* ---------- CRM BOARD ---------- */
.board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; margin-top:10px; }
.column{ min-width:230px; flex:1; }
.column h4{
  font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between;
}
.column h4 .count{ color:var(--amber); }
.mini-card{
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;
  display:flex; flex-direction:column; gap:8px;
}
.mini-card .mc-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.mini-card h5{ font-size:13px; font-family:'Space Grotesk',sans-serif; }
.mini-card .mc-score{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--amber); }
.mini-card select{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:11px;
  padding:6px; border-radius:6px; font-family:'JetBrains Mono',monospace;
}
.mini-card .mc-btns{ display:flex; gap:6px; }
.msg-btn{
  flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  font-size:11px; padding:7px; border-radius:6px; cursor:pointer; font-family:'JetBrains Mono',monospace;
}
.msg-btn:hover{ border-color: var(--amber); color:var(--amber); }
.del-btn{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; }
.del-btn:hover{ color:var(--rec); }

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.modal-overlay.open{ display:flex; }
.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; max-width:520px; width:100%;
  max-height:85vh; overflow-y:auto;
}
.modal h3{ font-family:'Space Grotesk',sans-serif; margin-bottom:14px; }
.channels{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.chan-btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  padding:7px 12px; border-radius:20px; font-size:11px; font-family:'JetBrains Mono',monospace; cursor:pointer;
}
.chan-btn.active{ background:var(--amber); color:#1a1204; border-color:var(--amber); font-weight:700; }
.modal textarea{
  width:100%; min-height:180px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:12px; font-family:'Inter',sans-serif; font-size:13px; line-height:1.5; resize:vertical;
}
.modal-footer{ display:flex; justify-content:space-between; margin-top:14px; gap:8px; }
.modal-footer .close-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); padding:9px 16px; border-radius:7px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12px;}
.modal-footer .copy-btn{ background:var(--amber); color:#1a1204; border:none; padding:9px 16px; border-radius:7px; cursor:pointer; font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:13px;}

#view-scan, #view-board{ display:none; }
#view-scan.active, #view-board.active{ display:block; }

@media (max-width:640px){
  header{ padding:16px; }
  main{ padding:16px; }
  .scan-panel{ flex-direction:column; align-items:stretch; }
}
</style>
<!--
  Film Radar - Vercel
  La IA se llama desde /api/scan y /api/message para no exponer ANTHROPIC_API_KEY
  en el navegador. Configura ANTHROPIC_API_KEY en Vercel > Settings > Environment Variables.
-->
</head>
<body>

<header>
  <div class="brand">
    <span class="rec-dot"></span>
    <div>
      <h1 class="display">Film Radar</h1>
      <div class="tag mono">radar de trabajo audiovisual</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="scan">📡 Buscar</button>
    <button class="tab-btn" data-view="board">📋 Seguimiento</button>
  </div>
</header>

<main>

  <div id="view-scan" class="active">
    <div class="scan-panel">
      <div class="field">
        <label>Tipo de oportunidad</label>
        <select id="tipo">
          <option>Negocios locales (restaurantes, tiendas, hostelería)</option>
          <option>Artistas y músicos (videoclips)</option>
          <option>Productoras y rodajes (trabajo de cámara)</option>
          <option>Publicidad y marcas</option>
          <option>Eventos, conciertos y festivales</option>
          <option>Un poco de todo</option>
        </select>
      </div>
      <div class="field">
        <label>Zona</label>
        <input id="zona" type="text" value="Zaragoza ciudad">
      </div>
      <button class="scan-btn" id="scanBtn">
        <span class="radar-icon" id="radarIcon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#1a1204" stroke-width="1.5" opacity="0.5"/>
            <circle cx="12" cy="12" r="6" stroke="#1a1204" stroke-width="1.5" opacity="0.7"/>
            <line x1="12" y1="12" x2="12" y2="2" stroke="#1a1204" stroke-width="2"/>
          </svg>
        </span>
        <span id="scanLabel">Escanear</span>
      </button>
    </div>
    <div class="status-line mono" id="statusLine"></div>

    <div class="results" id="results">
      <div class="empty">Todavía no has escaneado nada. Elige tipo y zona, y dale a "Escanear".</div>
    </div>
  </div>

  <div id="view-board">
    <div class="board" id="board"></div>
  </div>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 class="display" id="modalTitle">Generar mensaje</h3>
    <div class="channels" id="channels"></div>
    <textarea id="msgText" placeholder="Elige un canal para generar el mensaje..."></textarea>
    <div class="modal-footer">
      <button class="close-btn" id="closeModal">Cerrar</button>
      <button class="copy-btn" id="copyMsg">Copiar mensaje</button>
    </div>
  </div>
</div>

<script>
const PHASES = ["Encontrada","Contactar","Contactado","Respondió","Reunión","Presupuesto","Ganada","Perdida"];
const CHANNELS = ["Email","WhatsApp","Instagram","LinkedIn","Mensaje corto","Propuesta comercial"];
let opportunities = []; // loaded from storage
let currentModalOpp = null;

// ---------------- Storage helpers ----------------
function loadOpportunities(){
  try{
    const raw = localStorage.getItem('filmRadar_opportunities');
    opportunities = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('No se pudo cargar el radar', e);
    opportunities = [];
  }
  renderBoard();
}

function saveOpportunities(){
  try{
    localStorage.setItem('filmRadar_opportunities', JSON.stringify(opportunities));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

// ---------------- Tabs ----------------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-scan').classList.remove('active');
    document.getElementById('view-board').classList.remove('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

// ---------------- Scan ----------------
document.getElementById('scanBtn').addEventListener('click', runScan);

async function runScan(){
  const tipo = document.getElementById('tipo').value;
  const zona = document.getElementById('zona').value.trim() || 'Zaragoza';
  const btn = document.getElementById('scanBtn');
  const icon = document.getElementById('radarIcon');
  const label = document.getElementById('scanLabel');
  const status = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');

  btn.disabled = true;
  icon.classList.add('spinning');
  label.textContent = 'Escaneando...';
  status.classList.add('active');
  status.textContent = '> buscando señales en la web para: ' + tipo.toLowerCase() + ' — ' + zona;
  resultsEl.innerHTML = '';

  const systemPrompt = `Eres el motor de análisis de Film Radar, una app para un videógrafo freelance en ${zona}.
Busca en la web oportunidades de trabajo audiovisual reales y recientes para la categoría: "${tipo}", en la zona: "${zona}".
No busques solo anuncios explícitos de "se busca videógrafo". Detecta también señales indirectas de posible necesidad de vídeo (aperturas, lanzamientos, nuevos productos, rodajes, eventos anunciados, etc).
Devuelve ÚNICAMENTE un array JSON válido (sin texto antes ni después, sin markdown, sin backticks) con máximo 4 oportunidades, en este formato exacto:
[{"nombre":"...","puntuacion":85,"explicacion":"por qué es una oportunidad, en 1-2 frases concretas basadas en lo encontrado","servicio":"qué ofrecerle en pocas palabras","precio":"rango estimado en euros","fuente":"nombre del sitio o url de donde sale la info"}]
Si no encuentras nada útil y verificable, devuelve un array vacío [].`;

  try{
    const response = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo, zona })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Error del servidor');
    const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let clean = textBlocks.replace(/```json|```/g,'').trim();
    const jsonStart = clean.indexOf('[');
    const jsonEnd = clean.lastIndexOf(']');
    let found = [];
    if(jsonStart !== -1 && jsonEnd !== -1){
      found = JSON.parse(clean.slice(jsonStart, jsonEnd+1));
    }

    if(found.length === 0){
      resultsEl.innerHTML = '<div class="empty">No he encontrado señales claras esta vez. Prueba con otra zona, otra categoría, o vuelve a escanear en unos días — esto es normal, no todas las búsquedas dan resultado.</div>';
      status.textContent = '> escaneo completo — 0 resultados';
    } else {
      resultsEl.innerHTML = '';
      found.forEach(o=>{
        o._localId = 'scan_' + Math.random().toString(36).slice(2,10);
        resultsEl.appendChild(renderCard(o));
      });
      status.textContent = `> escaneo completo — ${found.length} oportunidad(es) detectada(s)`;
    }
  }catch(e){
    console.error(e);
    resultsEl.innerHTML = '<div class="empty">Ha fallado el escaneo: ' + escapeHtml(e.message || 'error desconocido') + '</div>';
    status.textContent = '> error en el escaneo';
  }finally{
    btn.disabled = false;
    icon.classList.remove('spinning');
    label.textContent = 'Escanear';
    status.classList.remove('active');
  }
}

function renderCard(o){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-top">
      <h3>${escapeHtml(o.nombre || 'Oportunidad')}</h3>
      <div class="score"><div class="n">${o.puntuacion ?? '–'}</div><div class="d">/100</div></div>
    </div>
    <p class="explain">${escapeHtml(o.explicacion || '')}</p>
    <div class="tagrow">
      <span class="pill">💡 ${escapeHtml(o.servicio || '')}</span>
      <span class="pill">💶 ${escapeHtml(o.precio || '')}</span>
    </div>
    <div class="card-footer">
      <span class="src mono">${escapeHtml(o.fuente || '')}</span>
      <button class="add-btn">+ Añadir al radar</button>
    </div>
  `;
  card.querySelector('.add-btn').addEventListener('click', (e)=>{
    addToBoard(o);
    e.target.textContent = 'Añadida ✓';
    e.target.disabled = true;
  });
  return card;
}

function addToBoard(o){
  opportunities.push({
    id: 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    nombre: o.nombre,
    puntuacion: o.puntuacion,
    explicacion: o.explicacion,
    servicio: o.servicio,
    precio: o.precio,
    fuente: o.fuente,
    fase: 'Encontrada',
    mensaje: ''
  });
  saveOpportunities();
  renderBoard();
}

// ---------------- Board (CRM) ----------------
function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  PHASES.forEach(phase=>{
    const col = document.createElement('div');
    col.className = 'column';
    const items = opportunities.filter(o=>o.fase===phase);
    col.innerHTML = `<h4>${phase} <span class="count">${items.length}</span></h4>`;
    items.forEach(o=>{
      col.appendChild(renderMiniCard(o));
    });
    board.appendChild(col);
  });
  if(opportunities.length===0){
    board.innerHTML = '<div class="empty">Aún no tienes oportunidades guardadas. Ve a "Buscar", escanea, y dale a "Añadir al radar".</div>';
  }
}

function renderMiniCard(o){
  const div = document.createElement('div');
  div.className = 'mini-card';
  div.innerHTML = `
    <div class="mc-top">
      <h5>${escapeHtml(o.nombre)}</h5>
      <button class="del-btn" title="Eliminar">✕</button>
    </div>
    <div class="mc-score">${o.puntuacion}/100</div>
    <select class="phase-select">
      ${PHASES.map(p=>`<option value="${p}" ${p===o.fase?'selected':''}>${p}</option>`).join('')}
    </select>
    <div class="mc-btns">
      <button class="msg-btn">✉️ Mensaje</button>
    </div>
  `;
  div.querySelector('.phase-select').addEventListener('change', (e)=>{
    o.fase = e.target.value;
    saveOpportunities();
    renderBoard();
  });
  div.querySelector('.del-btn').addEventListener('click', ()=>{
    opportunities = opportunities.filter(x=>x.id!==o.id);
    saveOpportunities();
    renderBoard();
  });
  div.querySelector('.msg-btn').addEventListener('click', ()=> openModal(o));
  return div;
}

// ---------------- Message modal ----------------
function openModal(o){
  currentModalOpp = o;
  document.getElementById('modalTitle').textContent = 'Mensaje para: ' + o.nombre;
  document.getElementById('msgText').value = o.mensaje || '';
  const chWrap = document.getElementById('channels');
  chWrap.innerHTML = '';
  CHANNELS.forEach(ch=>{
    const b = document.createElement('button');
    b.className = 'chan-btn';
    b.textContent = ch;
    b.addEventListener('click', ()=> generateMessage(o, ch, b));
    chWrap.appendChild(b);
  });
  document.getElementById('modalOverlay').classList.add('open');
}
document.getElementById('closeModal').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('copyMsg').addEventListener('click', ()=>{
  const ta = document.getElementById('msgText');
  ta.select();
  document.execCommand('copy');
});

async function generateMessage(o, channel, btnEl){
  document.querySelectorAll('.chan-btn').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');
  const ta = document.getElementById('msgText');
  ta.value = 'Generando mensaje...';

  const systemPrompt = `Eres un asistente que escribe mensajes de contacto comercial para un videógrafo freelance.
Escribe un mensaje en español, canal: "${channel}", dirigido a: "${o.nombre}".
Contexto de la oportunidad: ${o.explicacion}
Servicio a ofrecer: ${o.servicio}. Rango de precio orientativo: ${o.precio}.
El tono debe ser cercano, profesional, breve y sin sonar a plantilla genérica. Adapta la longitud y formalidad al canal (WhatsApp/Instagram: muy breve e informal; Email/Propuesta: más formal y algo más largo; LinkedIn: profesional y directo; Mensaje corto: 2-3 frases).
No inventes datos de contacto ni firmes con un nombre genérico. Responde ÚNICAMENTE con el texto del mensaje, sin explicaciones ni comillas.`;

  try{
    const response = await fetch("/api/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        channel,
        nombre: o.nombre,
        explicacion: o.explicacion,
        servicio: o.servicio,
        precio: o.precio
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Error del servidor');
    const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    ta.value = text || 'No se ha podido generar el mensaje. Inténtalo de nuevo.';
    o.mensaje = ta.value;
    saveOpportunities();
  }catch(e){
    console.error(e);
    ta.value = 'Ha fallado la generación del mensaje: ' + (e.message || 'error desconocido');
  }
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadOpportunities();
</script>
</body>
</html>
